version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: inmotech-postgres
    environment:
      POSTGRES_DB: inmotech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inmotech-backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: inmotech
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: tu_secreto_jwt_super_seguro_cambiar_en_produccion
      JWT_EXPIRES_IN: 7d
      PORT: 3000
      NODE_ENV: development
      FRONTEND_ADMIN_URL: http://localhost:5173
      FRONTEND_RESIDENTE_URL: http://localhost:5174
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run db:migrate && npm run db:seed && npm run dev"

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: inmotech-admin
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-admin:/app
      - /app/node_modules
    depends_on:
      - backend

  frontend-residente:
    build:
      context: ./frontend-residente
      dockerfile: Dockerfile
    container_name: inmotech-residente
    ports:
      - "5174:5174"
    volumes:
      - ./frontend-residente:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:

